name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Run unit tests
        run: go test ./... -cover

      - name: Run race tests
        run: go test -race ./...

      - name: Run integration tests
        run: go test -tags=integration ./cmd

      - name: Run bounded fuzz jobs
        run: go test ./internal/parser/... -run=^$ -fuzz=Fuzz -fuzztime=5s
